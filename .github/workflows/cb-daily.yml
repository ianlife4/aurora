name: CB Daily Update

on:
  schedule:
    # 每天 10:10 (台北 UTC+8) = 02:10 UTC,TWSE 競拍開標公告通常 10:00 出爐,延 10 分鐘抓
    - cron: '10 2 * * *'
    # 每天 18:30 (台北) = 10:30 UTC,收盤後再跑一輪 (補當天 TWSE 結果 + CB 二級行情)
    - cron: '30 10 * * *'
  workflow_dispatch: # 手動觸發

# 並發控制 — 同時只能跑一個 instance
concurrency:
  group: cb-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet requests beautifulsoup4 lxml urllib3 pdfplumber

      - name: Run CB pipeline
        working-directory: CB/automation
        env:
          PYTHONIOENCODING: utf-8
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        timeout-minutes: 15
        run: |
          # 每天跑「輕量必要」step (~2-5 分鐘):
          #   - fetch_twse_upcoming         (TWSE 即將開標)
          #   - fetch_twse_auction_results  (TWSE 競拍結果回填 + INSERT 新案,當天開標)
          #   - fetch_mops_conv_price       (MOPS 訂定轉換價公告)
          #   - fill_missing_stocks         (FinMind 補新發 CB 母股到 stocks 表)
          #   - build_html                  (DB → HTML,含 issuances + auctions 雙清單)
          #   - git commit + push           (HTML + DB 進 main branch)
          # 跳過 (太慢,移到 weekly deep scan):
          #   --skip-discover    discover_new_cbs (即使 --days 7 也會 timeout)
          #   --skip-milestones  fetch_mops_milestones (對近 1 年案重抓會 timeout)
          # 跳過 (本機限定):
          #   --skip-analyze   (Anthropic API + PDF parsing)
          #   --skip-publish   (我們直接 commit aurora,不 cross-repo push)
          # 注意:「已發行」tab 新案 + 董事會/專戶日期更新依賴 weekly deep scan
          #       每週六 03:00 跑 cb-weekly-deep.yml 補完整 issued 表
          python mops_daily.py \
            --skip-discover \
            --skip-milestones \
            --skip-analyze \
            --skip-publish \
            --no-tg

      - name: Check changes
        id: check
        working-directory: ${{ github.workspace }}
        run: |
          git add CB/CB管理.html CB/automation/cb_data.db CB/charts
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No DB or HTML changes — skipping commit"
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
            git diff --cached --stat
          fi

      - name: Commit & push
        if: steps.check.outputs.no_changes == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "CB cron $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mops-daily-log
          path: CB/automation/mops_daily.log
          if-no-files-found: ignore
