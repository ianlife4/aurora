name = "aurora-cron"
main = "worker.js"
compatibility_date = "2026-04-24"

# CF Cron Triggers (UTC)
# 2026-11-25: 3 lines merged into ONE "*/10" line; worker.js plan() dispatches by scheduledTime.
#   aurora     : Mon-Fri UTC 01:30/05:00/07:30 (TW 09:30/13:00/15:30), daily UTC 10:00 (TW 18:00)
#   earnings-calendar: keep-alive every 10 min, health hourly, backup UTC 06:00/18:00 (TW 14:00/02:00)
# NOTE: CF cron day-of-week is 1=Sunday; old "1-5" really meant Sun-Thu (Friday was skipped).
#       Weekday logic now lives in JS getUTCDay(). Account cron limit is 5; this frees 2 slots.
[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "EARNINGS_BACKUP"
id = "3d9877f01c864601ad81f83a2dfcf8a0"

# Secrets (wrangler secret put, never in code - this repo is PUBLIC):
#   GITHUB_TOKEN, TRIGGER_KEY, EARNINGS_SITE_KEY, TG_BOT_TOKEN, TG_CHAT_ID, EC_ADMIN_KEY
